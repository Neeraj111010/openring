[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openring"
version = "0.1.1"
description = "Open-source, self-hosted voice AI agents with a Vapi-compatible API. Zero platform fee."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[deepgram,openai,elevenlabs,silero,websocket,runner]>=1.15,<2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  # WebRTC for browser test calls; pipecat-ai[webrtc] would also pull OpenCV, used only for video.
  "aiortc>=1.14,<2",
  # Ed25519 signatures on Telnyx webhooks (aiortc already brings it).
  "cryptography>=42",
]

[project.optional-dependencies]
kokoro = ["pipecat-ai[kokoro]>=1.15,<2"]
dev = ["pytest>=8", "ruff>=0.13"]

[project.scripts]
openring = "openring.__main__:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["openring"]
known-local-folder = ["test_api"]  # tests import shared fixtures from each other
