[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openring"
version = "0.1.0"
description = "Open-source, self-hosted voice AI agents with a Vapi-compatible API. Zero platform fee."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[deepgram,openai,elevenlabs,silero,websocket,runner]>=1.15,<2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
kokoro = ["pipecat-ai[kokoro]>=1.15,<2"]
dev = ["pytest>=8"]

[project.scripts]
openring = "openring.__main__:main"
