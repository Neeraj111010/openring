name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never paste API keys, tokens or phone numbers: replace them with `xxx`.
        Found a security problem? Report it privately instead, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create an assistant with ...
        2. Start a browser test call
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenRing version
      description: Shown under the logo in the dashboard, or in `GET /health`.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run OpenRing?
      options: ["npx openring", "pip / uv", "Docker", "From a git checkout"]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04 ...
  - type: input
    id: providers
    attributes:
      label: Providers involved
      description: Speech-to-text, model, voice and telephony, if the problem is in a call.
      placeholder: Deepgram nova-3, Groq openai/gpt-oss-20b, Kokoro, Twilio
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The terminal output around the error, with keys removed.
      render: text
